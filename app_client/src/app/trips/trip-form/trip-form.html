<h2 *ngIf="mode==='create'">Add Trip</h2>
<h2 *ngIf="mode==='edit'">Edit Trip</h2>

<div *ngIf="error" class="alert alert-danger">{{ error }}</div>

<form [formGroup]="form" (ngSubmit)="save()" class="row g-3">
  <div class="col-md-3">
    <label class="form-label">Code</label>
    <input class="form-control" formControlName="code" [readonly]="mode==='edit'">
  </div>
  <div class="col-md-9">
    <label class="form-label">Title</label>
    <input class="form-control" formControlName="title">
  </div>
  <div class="col-12">
    <label class="form-label">Summary</label>
    <textarea rows="3" class="form-control" formControlName="summary"></textarea>
  </div>
  <div class="col-md-3">
    <label class="form-label">Length (days)</label>
    <input type="number" class="form-control" formControlName="length">
  </div>
  <div class="col-md-3">
    <label class="form-label">Price</label>
    <input type="number" class="form-control" formControlName="price">
  </div>
  <div class="col-md-6">
    <label class="form-label">Image filename</label>
    <input class="form-control" formControlName="image">
  </div>

  <div class="col-12 d-flex gap-2">
    <button class="btn btn-primary" type="submit" [disabled]="busy">Save</button>
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
  </div>
</form>
